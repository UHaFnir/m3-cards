name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      # README.md is generated from docs/cards/*.md + docs/README.template.md
      # (see scripts/build-readme.mjs) and can't be gitignored like dist/ —
      # HACS and GitHub both read it. This is the only thing enforcing
      # "generated, don't hand-edit": a dirty tree after regenerating means
      # someone edited README.md directly, or a card doc drifted from it.
      # package.json is in the check because the generator also writes the
      # card count into its description — one of the four places TESTING.md's
      # release checklist has to keep honest, now counted rather than counted on.
      - name: Docs up to date
        run: |
          npm run docs
          git diff --exit-code -- README.md package.json docs/

      # Runs on CI rather than in release.yml on purpose: a failure here is
      # seen before a release exists, where the same failure would leave a
      # published release with no bundle attached to it.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
